# Plantilla para Fly.io. Cambia "app" por un nombre único tuyo antes de
# desplegar (o deja que `fly launch` lo regenere automáticamente).
app = "tracks-downloader-api"
primary_region = "mad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
